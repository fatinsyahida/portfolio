<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-[#111216] max-w-lg w-full mx-4 rounded-lg shadow-lg border border-gray-800 overflow-hidden">
    <div class="relative">
      <div class="h-52 bg-cover bg-center"
           [style.backgroundImage]="'url(' + project.image + ')'"></div>
      <button (click)="close.emit()" class="absolute top-3 right-3 bg-pink-600 hover:bg-pink-700 text-white rounded-full p-1.5">
        ✕
      </button>
    </div>
    <div class="p-6">
      <h2 class="text-2xl font-semibold mb-2 text-gray-100">{{ project.title }}</h2>
      <p class="text-gray-300 mb-4">{{ project.description }}</p>
      <div class="flex flex-wrap gap-2 mb-4">
        <span *ngFor="let tag of project.tags"
              class="text-xs px-2 py-1 rounded bg-gray-800 text-gray-300 border border-gray-700">{{ tag }}</span>
      </div>
      <a *ngIf="project.link"
         [href]="project.link"
         target="_blank"
         class="inline-block text-pink-400 hover:text-pink-500 font-medium">
         🔗 Visit Project
      </a>
    </div>
  </div>
</div>

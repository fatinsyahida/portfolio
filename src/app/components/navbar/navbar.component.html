<nav class="flex justify-between items-center bg-[#1a1a2e] text-gray-200 px-6 md:px-16 py-4 shadow-md fixed top-0 w-full z-50">
  <!-- Logo -->
  <a
    routerLink="/"
    routerLinkActive="text-pink-500"
    [routerLinkActiveOptions]="{ exact: true }"
    class="text-lg md:text-xl font-bold hover:text-pink-500 transition-colors duration-300 tracking-wide"
  >
    Fatin Syahida | <span class="text-pink-400">Software Developer</span>
  </a>

  <!-- Desktop Menu -->
  <ul class="hidden md:flex gap-10 relative">
    <li class="group relative">
      <a
        routerLink="/about"
        routerLinkActive="active-link"
        class="hover:text-pink-500 transition-colors duration-300"
      >
        About
      </a>
      <span
        class="absolute bottom-[-10px] left-0 w-0 h-[2px] bg-pink-600 transition-all duration-300 group-hover:w-full"
      ></span>
    </li>
    <li class="group relative">
      <a
        routerLink="/skills"
        routerLinkActive="active-link"
        class="hover:text-pink-500 transition-colors duration-300"
      >
        Skills
      </a>
      <span
        class="absolute bottom-[-10px] left-0 w-0 h-[2px] bg-pink-600 transition-all duration-300 group-hover:w-full"
      ></span>
    </li>
    <li class="group relative">
      <a
        routerLink="/projects"
        routerLinkActive="active-link"
        class="hover:text-pink-500 transition-colors duration-300"
      >
        Projects
      </a>
      <span
        class="absolute bottom-[-10px] left-0 w-0 h-[2px] bg-pink-600 transition-all duration-300 group-hover:w-full"
      ></span>
    </li>
    <li class="group relative">
      <a
        routerLink="/contact"
        routerLinkActive="active-link"
        class="hover:text-pink-500 transition-colors duration-300"
      >
        Contact
      </a>
      <span
        class="absolute bottom-[-10px] left-0 w-0 h-[2px] bg-pink-600 transition-all duration-300 group-hover:w-full"
      ></span>
    </li>
  </ul>

  <!-- Hamburger -->
  <button
    class="md:hidden text-gray-200 focus:outline-none z-[60]"
    (click)="toggleMenu()"
    aria-label="Toggle Menu"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-7 w-7"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        [attr.d]="
          isMenuOpen
            ? 'M6 18L18 6M6 6l12 12'
            : 'M4 6h16M4 12h16M4 18h16'
        "
      />
    </svg>
  </button>

  <!-- Mobile Menu -->
  <div
    class="fixed top-0 right-0 h-full w-2/3 sm:w-1/2 bg-[#1a1a2e] md:hidden shadow-lg transform transition-transform duration-300 ease-in-out"
    [ngClass]="{
      'translate-x-0': isMenuOpen,
      'translate-x-full': !isMenuOpen
    }"
  >
    <ul class="flex flex-col items-center justify-center h-full gap-6">
      <li *ngFor="let link of [
        { path: '/', label: 'Home' },
        { path: '/about', label: 'About' },
        { path: '/skills', label: 'Skills' },
        { path: '/projects', label: 'Projects' },
        { path: '/contact', label: 'Contact' }
      ]">
        <a
          (click)="toggleMenu()"
          [routerLink]="link.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          class="relative inline-block text-lg font-medium text-gray-200 hover:text-pink-500 transition-colors duration-300"
        >
          {{ link.label }}
          <span
            class="absolute bottom-[-6px] left-0 w-0 h-[2px] bg-pink-600 transition-all duration-300 hover:w-full"
          ></span>
        </a>
      </li>
    </ul>
  </div>
</nav>

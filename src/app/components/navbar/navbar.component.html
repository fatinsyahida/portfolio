<nav
  class="flex justify-between items-center bg-[#0b0b0c]/95 backdrop-blur-md text-gray-100 px-6 md:px-16 py-4 shadow-lg fixed top-0 w-full z-50 border-b border-pink-600/20 shadow-[0_4px_30px_-10px_rgba(255,105,180,0.4)]"
>

  <!-- Logo -->
  <a
    routerLink="/"
    routerLinkActive="text-pink-500"
    (click)="scrollToTop()"
    [routerLinkActiveOptions]="{ exact: true }"
    class="text-lg md:text-xl font-bold hover:text-pink-400 transition-colors duration-300 tracking-wide"
  >
    Fatin Syahida | <span class="text-pink-500">Software Developer</span>
  </a>

  <!-- Desktop Menu -->
  <ul class="hidden md:flex gap-10 relative">
    <li class="group relative">
      <a
        href="#about"
        routerLinkActive="active-link"
        class="hover:text-pink-400 transition-colors duration-300"
      >
        About
      </a>
      <span
        class="absolute bottom-[-8px] left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 group-hover:w-full"
      ></span>
    </li>
    <li class="group relative">
      <a
        href="#skills"
        routerLinkActive="active-link"
        class="hover:text-pink-400 transition-colors duration-300"
      >
        Skills
      </a>
      <span
        class="absolute bottom-[-8px] left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 group-hover:w-full"
      ></span>
    </li>
    <li class="group relative">
      <a
        href="#projects"
        routerLinkActive="active-link"
        class="hover:text-pink-400 transition-colors duration-300"
      >
        Projects
      </a>
      <span
        class="absolute bottom-[-8px] left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 group-hover:w-full"
      ></span>
    </li>
    <li class="group relative">
      <a
        href="#contact"
        routerLinkActive="active-link"
        class="hover:text-pink-400 transition-colors duration-300"
      >
        Contact
      </a>
      <span
        class="absolute bottom-[-8px] left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 group-hover:w-full"
      ></span>
    </li>
  </ul>

  <!-- Hamburger -->
  <button
    class="md:hidden text-gray-100 focus:outline-none z-[60]"
    (click)="toggleMenu()"
    aria-label="Toggle Menu"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-7 w-7"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        [attr.d]="
          isMenuOpen
            ? 'M6 18L18 6M6 6l12 12'
            : 'M4 6h16M4 12h16M4 18h16'
        "
      />
    </svg>
  </button>

</nav>

<!-- Mobile Menu -->
<div
  class="fixed top-0 left-0 w-full h-full z-[60]
         bg-[#0b0b0c] md:hidden 
         shadow-lg transform transition-transform duration-300 ease-in-out"
  [ngClass]="{
    'translate-x-0': isMenuOpen,
    'translate-x-full': !isMenuOpen
  }"
>
  <button
    class="absolute top-6 right-6 text-gray-100 hover:text-pink-400 transition-colors duration-300"
    (click)="toggleMenu()"
    aria-label="Close Menu"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-7 w-7"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M6 18L18 6M6 6l12 12"
      />
    </svg>
  </button>
  <ul class="flex flex-col items-center justify-center h-full gap-8">
    <li>
      <a
        href="#about"
        (click)="toggleMenu()"
        class="relative inline-block text-lg font-medium text-gray-100 hover:text-pink-400 transition-colors duration-300"
      >
        About
        <span
          class="absolute bottom-[-6px] left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 hover:w-full"
        ></span>
      </a>
    </li>
    <li>
      <a
        href="#skills"
        (click)="toggleMenu()"
        class="relative inline-block text-lg font-medium text-gray-100 hover:text-pink-400 transition-colors duration-300"
      >
        Skills
        <span
          class="absolute bottom-[-6px] left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 hover:w-full"
        ></span>
      </a>
    </li>
    <li>
      <a
        href="#projects"
        (click)="toggleMenu()"
        class="relative inline-block text-lg font-medium text-gray-100 hover:text-pink-400 transition-colors duration-300"
      >
        Projects
        <span
          class="absolute bottom-[-6px] left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 hover:w-full"
        ></span>
      </a>
    </li>
    <li>
      <a
        href="#contact"
        (click)="toggleMenu()"
        class="relative inline-block text-lg font-medium text-gray-100 hover:text-pink-400 transition-colors duration-300"
      >
        Contact
        <span
          class="absolute bottom-[-6px] left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 hover:w-full"
        ></span>
      </a>
    </li>
  </ul>
</div>
